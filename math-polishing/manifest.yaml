name: math-polishing
version: 1.0.0
description: >
  Declarative manifest for the static/dynamic split. SKILL.md uses this to
  decide which fragments to load for a given math-paper polishing request.

always_load:
  - static/core/stance.md
  - static/core/failure-modes.md
  - static/core/output-format.md

axes:
  paper_type:
    detect: |
      Decide what kind of math paper is being polished. Default to theoretical.
      Use the user's stated framing first; fall back to inference from the text.
      Use computational for numerical, applied, or modeling papers that contain
      algorithms, numerical experiments, or governing equations from
      applications. Use survey for review or expository articles.
    values:
      theoretical:    static/fragments/paper_type/theoretical.md
      computational:  static/fragments/paper_type/computational.md
      survey:         static/fragments/paper_type/survey.md
    default: theoretical
    multi: false

  section:
    detect: |
      Identify which section(s) the user wants polished. The user may name
      one or several. Ask the user only when the section is genuinely
      ambiguous AND the choice changes the polish. If the user's label
      conflicts with clear structural evidence (e.g., a road-map paragraph
      or citations in a passage labeled "abstract"), proceed with the
      detected value and flag the discrepancy in the revision notes.
      Skip this axis only when the user provides standalone prose with
      no section context.
      `body` covers everything between Introduction and Conclusions,
      including theorem/proof blocks and numerical-result sections.
    values:
      title:           static/fragments/section/title.md
      abstract:        static/fragments/section/abstract.md
      intro:           static/fragments/section/intro.md
      body:            static/fragments/section/body.md
      conclusion:      static/fragments/section/conclusion.md
      acknowledgments: static/fragments/section/acknowledgments.md
      references:      static/fragments/section/references.md
    multi: true

  language:
    detect: |
      Detect the source language of the draft. Use zh-to-en when the draft
      is Chinese or shows strong Chinese-influenced English structure.
      Otherwise use en.
    values:
      en:             static/fragments/language/en.md
      zh-to-en:       static/fragments/language/zh-to-en.md
    default: en
    multi: false

references:
  on_demand:
    - condition: user asks to see an example, a rule needs a concrete demonstration, or a section is being drafted from scratch — curated published exemplars (titles, abstracts, intro openings, conclusions, acknowledgments), revision before/after pairs, and reference-entry style variants; adapt the pattern, never copy the wording into the user's draft
      path: references/worked-examples.md
    - condition: needs math sentence patterns, proof-opening/closing formulas, omitting-proof phrasing, connective choice with emphasis gradation, transition sentences between paragraphs, figure/table reporting phrases, conclusion or intro stock phrases, or idiomatic replacements for Chinese-influenced phrasing
      path: references/math-phrasebook.md
    - condition: whole-manuscript pre-submission revision rather than passage polish — deletion pass, focus/highlight check, structural cosmetics (title, headings, equation numbering), figure/table audit, final checklist, or plagiarism concerns (including self-plagiarism and uncredited reuse of figures or text)
      path: references/revision-playbook.md
